name: build-pdf
on:
  push:
    branches: [main]
    paths: ['index.html', 'map.html', 'guide.html']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install puppeteer
        run: npm init -y >/dev/null && npm i puppeteer@22
      - name: Render index.html to wathiqa.pdf
        run: node scripts/make-pdf.mjs
      - name: Commit updated PDF
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add wathiqa.pdf
          git diff --cached --quiet || (git commit -m "تحديث PDF تلقائياً" && git push)
